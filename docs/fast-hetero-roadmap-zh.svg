<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">fast_hetero() · 技术路线</title><desc id="desc">从共享系统发育树到局部信号、总体背景与生物学解释. Δ 推荐流程：局部与总体描述，同时检查拟合和 MCMC 诊断。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#3e7888"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;fill:#17364d} .title{font-size:32px;font-weight:750} .heading{font-size:23px;font-weight:700} .body{font-size:18px} .muted{font-size:17px;fill:#52687a} .card-title{font-size:20px;font-weight:700} .card-text{font-size:17px} .flow{fill:none;stroke:#3e7888;stroke-width:2.2;marker-end:url(#arrow)} .optional{stroke-dasharray:7 5}</style>
<rect width="1120" height="1080" rx="16" fill="#fff"/>
<text x="40" y="47" class="title">fast_hetero() · 技术路线</text><text x="40" y="79" class="muted">从共享系统发育树到局部信号、总体背景与生物学解释</text><path d="M42 105 H83" class="flow"/><text x="95" y="110" class="muted">局部描述主流程</text><path d="M365 105 H406" class="flow optional"/><text x="418" y="110" class="muted">按需启用的分析</text><rect x="40" y="135" width="1040" height="100" rx="12" fill="#f0f7f9" stroke="#a9c7d0" stroke-width="1.3"/><text x="65" y="167" class="heading">01 · 输入与树编译</text><text x="65" y="199" class="body">带枝长的有根树 + 按物种命名的性状；指定 K、λ、D 或 Δ。</text><text x="65" y="226" class="body">为冠群扫描一次性编译拓扑与枝长结构。</text><path d="M290 235 V265" class="flow"/><rect x="40" y="265" width="500" height="135" rx="12" fill="#f0f7f9" stroke="#a9c7d0" stroke-width="1.3"/><text x="65" y="298" class="heading">02 · 选择单系冠群</text><text x="65" y="330" class="body">指定节点，或在 min_tips / max_tips 范围内</text><text x="65" y="357" class="body">自动选择最大不重叠冠群。</text><text x="65" y="384" class="body">保留原始节点、覆盖度与重叠信息。</text><path d="M540 332 H580" class="flow"/><rect x="580" y="265" width="500" height="135" rx="12" fill="#f0f7f9" stroke="#a9c7d0" stroke-width="1.3"/><text x="605" y="298" class="heading">03 · 对齐并筛选实际观测</text><text x="605" y="330" class="body">匹配物种，按性状处理缺失值。</text><text x="605" y="357" class="body">对相同缺失模式复用工作空间。</text><text x="605" y="384" class="body">检查实际观测数与分类状态组成。</text><path d="M830 400 V417 H560 V440" class="flow"/><rect x="40" y="440" width="1040" height="155" rx="12" fill="#edf6f1" stroke="#a9c7d0" stroke-width="1.3"/><text x="65" y="475" class="heading">04 · 共享 C++ 内核扫描冠群</text><rect x="55" y="491" width="235" height="88" rx="12" fill="#fff" stroke="#a9c7d0" stroke-width="1.3"/><text x="69" y="516" class="card-title">K · 连续性状</text><text x="69" y="542" class="card-text">fast_k 内核</text><text x="69" y="565" class="card-text">对比 / 置换</text><rect x="313" y="491" width="235" height="88" rx="12" fill="#fff" stroke="#a9c7d0" stroke-width="1.3"/><text x="327" y="516" class="card-title">λ · 连续性状</text><text x="327" y="542" class="card-text">fast_lambda 内核</text><text x="327" y="565" class="card-text">似然 / 优化</text><rect x="571" y="491" width="235" height="88" rx="12" fill="#fff" stroke="#a9c7d0" stroke-width="1.3"/><text x="585" y="516" class="card-title">D · 二元性状</text><text x="585" y="542" class="card-text">fast_d 内核</text><text x="585" y="565" class="card-text">对比 / 参考模拟</text><rect x="829" y="491" width="235" height="88" rx="12" fill="#fff" stroke="#a9c7d0" stroke-width="1.3"/><text x="843" y="516" class="card-title">Δ · 分类性状</text><text x="843" y="542" class="card-text">fast_ace → 祖先概率</text><text x="843" y="565" class="card-text">fast_delta → MCMC</text><path d="M560 595 V855" class="flow"/><path d="M290 595 V640" class="flow optional"/><path d="M830 595 V640" class="flow optional"/><rect x="40" y="640" width="500" height="160" rx="12" fill="#f8fafc" stroke="#a9c7d0" stroke-width="1.3" stroke-dasharray="7 5"/><text x="65" y="675" class="heading">可选 A · 整树分析</text><text x="65" y="707" class="body">overall = TRUE：计算整树信号估计。</text><text x="65" y="734" class="body">overall_test = TRUE：增加普通整树信号检验。</text><text x="65" y="761" class="body">复用对应指标的计算内核。</text><rect x="580" y="640" width="500" height="160" rx="12" fill="#f8fafc" stroke="#a9c7d0" stroke-width="1.3" stroke-dasharray="7 5"/><text x="605" y="675" class="heading">可选 B · 冠群离散参考</text><text x="605" y="707" class="body">test = TRUE；使用不重叠冠群。</text><text x="605" y="734" class="body">K：BM；λ：共同局部 λ 的近似参考。</text><text x="605" y="761" class="body">D：计数条件 ER（实验性）。</text><path d="M290 800 V855" class="flow optional"/><path d="M830 800 V855" class="flow optional"/><rect x="40" y="855" width="1040" height="145" rx="12" fill="#f0f7f9" stroke="#a9c7d0" stroke-width="1.3"/><text x="65" y="890" class="heading">05 · 汇总与绘图</text><text x="65" y="922" class="body">clades + heterogeneity + selection；按需返回 overall。</text><text x="65" y="949" class="body">保留局部与总体差异、状态组成、拟合诊断和失败记录。</text><text x="65" y="976" class="body">原生 plot()：冠群着色、检验分别标注；绘图保持随机数状态。</text><text x="40" y="1040" class="muted">Δ 推荐流程：局部与总体描述，同时检查拟合和 MCMC 诊断。</text></svg>
