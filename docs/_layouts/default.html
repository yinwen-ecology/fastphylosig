<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}fastphylosig</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="fastphylosig home">fastphylosig</a>
        <nav class="site-nav" aria-label="Project links">
          <a href="https://github.com/yinwen-ecology/fastphylosig">GitHub</a>
          <a href="https://github.com/yinwen-ecology/fastphylosig/issues">Issues</a>
          <a href="{{ '/fast-hetero-case.html' | relative_url }}">fast_hetero case</a>
          <a href="https://github.com/yinwen-ecology/fastphylosig/releases/tag/v0.3.4">v0.3.4 release</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="{% if page.url == '/' or page.url == '/index.html' %}home-page{% else %}document-page{% endif %} {{ page.page_class }}">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>fastphylosig · phylogenetic signal statistics for R</span>
        <a href="https://github.com/yinwen-ecology/fastphylosig">Source and documentation</a>
      </div>
    </footer>
  </body>
</html>
