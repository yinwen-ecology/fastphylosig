<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">fastphylosig 技术路线图</title>
  <desc id="desc">树和性状数据同时进入一般与高级路径。一般路径由 fast_signal 自动准备和计算；高级路径显式整理树与数据后调用专业方法函数。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#425466"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #182230; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #526171; }
      .lane-title { font-size: 20px; font-weight: 700; }
      .node-title { font-size: 18px; font-weight: 700; }
      .node-body { font-size: 15px; }
      .step { font-size: 14px; }
      .small { font-size: 13px; fill: #526171; }
      .code { font-family: Consolas, "SFMono-Regular", monospace; }
      .line { fill: none; stroke: #425466; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="820" fill="#ffffff"/>
  <text x="50" y="54" class="title">fastphylosig 技术路线图</text>
  <text x="50" y="84" class="subtitle">同一份输入，两种用法：一般用户一条命令，高级用户逐步控制。</text>

  <g aria-label="legend">
    <rect x="1360" y="35" width="18" height="18" rx="3" fill="#dbeafe" stroke="#4f7cac"/>
    <text x="1386" y="49" class="small">入口</text>
    <rect x="1448" y="35" width="18" height="18" rx="3" fill="#eee6f3" stroke="#8b6b9b"/>
    <text x="1474" y="49" class="small">整理</text>
    <rect x="1545" y="35" width="18" height="18" rx="3" fill="#e3f2df" stroke="#669c59"/>
    <text x="1571" y="49" class="small">计算</text>
    <rect x="1642" y="35" width="18" height="18" rx="3" fill="#fff0d6" stroke="#c98718"/>
    <text x="1668" y="49" class="small">结果</text>
  </g>

  <rect x="30" y="305" width="220" height="170" rx="8" fill="#f7f8fa" stroke="#75808c" stroke-width="2"/>
  <text x="140" y="354" text-anchor="middle" class="node-title">共同输入</text>
  <text x="140" y="390" text-anchor="middle" class="node-body"><tspan class="code">phylo</tspan> 树</text>
  <text x="140" y="420" text-anchor="middle" class="node-body">带物种名的性状数据</text>
  <text x="140" y="450" text-anchor="middle" class="small">供两条路径使用</text>

  <rect x="290" y="130" width="1250" height="270" rx="8" fill="#f5f9ff" stroke="#7ba2cc" stroke-width="2"/>
  <text x="315" y="164" class="lane-title" fill="#255784">一般使用</text>
  <text x="436" y="164" class="small">一条命令，自动完成</text>

  <rect x="330" y="235" width="190" height="85" rx="8" fill="#dbeafe" stroke="#4f7cac" stroke-width="2"/>
  <text x="425" y="270" text-anchor="middle" class="node-title code">fast_signal()</text>
  <text x="425" y="297" text-anchor="middle" class="step code">tree, data, method</text>

  <rect x="560" y="190" width="610" height="170" rx="8" fill="#fbf9fc" stroke="#8b6b9b" stroke-width="2"/>
  <text x="865" y="222" text-anchor="middle" class="node-title">自动准备</text>
  <rect x="585" y="246" width="125" height="72" rx="6" fill="#eee6f3" stroke="#8b6b9b"/>
  <text x="647.5" y="276" text-anchor="middle" class="step">检查树</text>
  <text x="647.5" y="299" text-anchor="middle" class="small">方法就绪性</text>
  <rect x="725" y="246" width="125" height="72" rx="6" fill="#eee6f3" stroke="#8b6b9b"/>
  <text x="787.5" y="276" text-anchor="middle" class="step">匹配物种</text>
  <text x="787.5" y="299" text-anchor="middle" class="small">按名称重排</text>
  <rect x="865" y="246" width="125" height="72" rx="6" fill="#eee6f3" stroke="#8b6b9b"/>
  <text x="927.5" y="276" text-anchor="middle" class="step">处理 NA</text>
  <text x="927.5" y="299" text-anchor="middle" class="small">按性状保留</text>
  <rect x="1005" y="246" width="140" height="72" rx="6" fill="#eee6f3" stroke="#8b6b9b"/>
  <text x="1075" y="276" text-anchor="middle" class="step">准备 context</text>
  <text x="1075" y="299" text-anchor="middle" class="small">缓存树结构</text>
  <path class="line" d="M 710 282 H 725"/>
  <path class="line" d="M 850 282 H 865"/>
  <path class="line" d="M 990 282 H 1005"/>

  <rect x="1210" y="235" width="280" height="85" rx="8" fill="#e3f2df" stroke="#669c59" stroke-width="2"/>
  <text x="1350" y="270" text-anchor="middle" class="node-title">自动计算</text>
  <text x="1350" y="298" text-anchor="middle" class="step">按 <tspan class="code">method</tspan> 选择 K / lambda / D / Delta</text>
  <path class="line" d="M 520 277.5 H 560"/>
  <path class="line" d="M 1170 277.5 H 1210"/>

  <rect x="290" y="450" width="1250" height="300" rx="8" fill="#fffbf2" stroke="#d6a84c" stroke-width="2"/>
  <text x="315" y="484" class="lane-title" fill="#865b0b">高级使用</text>
  <text x="436" y="484" class="small">先整理树与数据，再调用专业函数</text>

  <rect x="330" y="500" width="800" height="205" rx="8" fill="#fbf9fc" stroke="#8b6b9b" stroke-width="2"/>
  <text x="730" y="533" text-anchor="middle" class="node-title">树与数据整理</text>
  <rect x="355" y="565" width="155" height="88" rx="6" fill="#eee6f3" stroke="#8b6b9b"/>
  <text x="432.5" y="600" text-anchor="middle" class="step code">check_tree()</text>
  <text x="432.5" y="626" text-anchor="middle" class="small">检查方法边界</text>
  <rect x="545" y="565" width="155" height="88" rx="6" fill="#eee6f3" stroke="#8b6b9b"/>
  <text x="622.5" y="594" text-anchor="middle" class="step code">resolve_tree()</text>
  <text x="622.5" y="617" text-anchor="middle" class="small">必要时显式处理</text>
  <text x="622.5" y="638" text-anchor="middle" class="small">树的表示或根</text>
  <rect x="735" y="565" width="155" height="88" rx="6" fill="#eee6f3" stroke="#8b6b9b"/>
  <text x="812.5" y="600" text-anchor="middle" class="step code">match_tree_data()</text>
  <text x="812.5" y="626" text-anchor="middle" class="small">匹配并记录移除</text>
  <rect x="925" y="565" width="155" height="88" rx="6" fill="#eee6f3" stroke="#8b6b9b"/>
  <text x="1002.5" y="600" text-anchor="middle" class="step code">prepare_tree()</text>
  <text x="1002.5" y="626" text-anchor="middle" class="small">建立可复用 context</text>
  <path class="line" d="M 510 609 H 545"/>
  <path class="line" d="M 700 609 H 735"/>
  <path class="line" d="M 890 609 H 925"/>

  <rect x="1180" y="515" width="310" height="175" rx="8" fill="#e3f2df" stroke="#669c59" stroke-width="2"/>
  <text x="1335" y="548" text-anchor="middle" class="node-title">系统发育信号计算</text>
  <text x="1220" y="582" class="step">K</text><text x="1310" y="582" class="step code">fast_k()</text>
  <text x="1220" y="611" class="step">lambda</text><text x="1310" y="611" class="step code">fast_lambda()</text>
  <text x="1220" y="640" class="step">D</text><text x="1310" y="640" class="step code">fast_d()</text>
  <text x="1220" y="669" class="step">Delta</text><text x="1310" y="669" class="step code">fast_delta()</text>
  <path class="line" d="M 1080 609 H 1180"/>

  <rect x="1580" y="230" width="190" height="430" rx="8" fill="#fff0d6" stroke="#c98718" stroke-width="2.5"/>
  <text x="1675" y="274" text-anchor="middle" class="node-title">统一结果</text>
  <line x1="1605" y1="293" x2="1745" y2="293" stroke="#d6a84c" stroke-width="1.5"/>
  <text x="1675" y="334" text-anchor="middle" class="node-body">方法原生结果</text>
  <text x="1675" y="365" text-anchor="middle" class="node-body">估计值与检验</text>
  <text x="1675" y="396" text-anchor="middle" class="node-body">workflow / timing</text>
  <text x="1675" y="443" text-anchor="middle" class="small">按方法提供</text>
  <text x="1675" y="475" text-anchor="middle" class="node-body">P / MCSE</text>
  <text x="1675" y="506" text-anchor="middle" class="node-body">ESS / R-hat</text>
  <text x="1675" y="561" text-anchor="middle" class="small">一般与高级路径返回</text>
  <text x="1675" y="584" text-anchor="middle" class="small">相同类型的结果</text>
  <path class="line" d="M 1490 277.5 H 1580"/>
  <path class="line" d="M 1490 609 H 1535 V 560 H 1580"/>

  <path class="line" d="M 250 347 H 270 V 277.5 H 330"/>
  <path class="line" d="M 250 433 H 270 V 609 H 355"/>
</svg>
