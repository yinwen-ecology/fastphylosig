<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">fast_hetero() · Technical workflow</title><desc id="desc">From a shared tree to local signal, whole-tree context and biological interpretation. Recommended Δ workflow: local and whole-tree description, with fit/MCMC diagnostics.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#3e7888"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;fill:#17364d} .title{font-size:32px;font-weight:750} .heading{font-size:23px;font-weight:700} .body{font-size:18px} .muted{font-size:17px;fill:#52687a} .card-title{font-size:20px;font-weight:700} .card-text{font-size:17px} .flow{fill:none;stroke:#3e7888;stroke-width:2.2;marker-end:url(#arrow)} .optional{stroke-dasharray:7 5}</style>
<rect width="1120" height="1080" rx="16" fill="#fff"/>
<text x="40" y="47" class="title">fast_hetero() · Technical workflow</text><text x="40" y="79" class="muted">From a shared tree to local signal, whole-tree context and biological interpretation</text><path d="M42 105 H83" class="flow"/><text x="95" y="110" class="muted">Local descriptive path</text><path d="M365 105 H406" class="flow optional"/><text x="418" y="110" class="muted">Optional analysis</text><rect x="40" y="135" width="1040" height="100" rx="12" fill="#f0f7f9" stroke="#a9c7d0" stroke-width="1.3"/><text x="65" y="167" class="heading">01 · Input and compile the tree</text><text x="65" y="199" class="body">Rooted tree with branch lengths + species-named traits; choose K, λ, D or Δ.</text><text x="65" y="226" class="body">Compile topology and branch geometry once for the crown scan.</text><path d="M290 235 V265" class="flow"/><rect x="40" y="265" width="500" height="135" rx="12" fill="#f0f7f9" stroke="#a9c7d0" stroke-width="1.3"/><text x="65" y="298" class="heading">02 · Select crown clades</text><text x="65" y="330" class="body">Prespecified nodes, or maximal disjoint crowns</text><text x="65" y="357" class="body">within min_tips / max_tips bounds.</text><text x="65" y="384" class="body">Retain node IDs, coverage and overlap.</text><path d="M540 332 H580" class="flow"/><rect x="580" y="265" width="500" height="135" rx="12" fill="#f0f7f9" stroke="#a9c7d0" stroke-width="1.3"/><text x="605" y="298" class="heading">03 · Align observed traits</text><text x="605" y="330" class="body">Match species; remove missing values by trait.</text><text x="605" y="357" class="body">Reuse workspaces for shared missing-data masks.</text><text x="605" y="384" class="body">Check observed counts and categorical states.</text><path d="M830 400 V417 H560 V440" class="flow"/><rect x="40" y="440" width="1040" height="155" rx="12" fill="#edf6f1" stroke="#a9c7d0" stroke-width="1.3"/><text x="65" y="475" class="heading">04 · Scan crowns with shared C++ kernels</text><rect x="55" y="491" width="235" height="88" rx="12" fill="#fff" stroke="#a9c7d0" stroke-width="1.3"/><text x="69" y="516" class="card-title">K · continuous</text><text x="69" y="542" class="card-text">fast_k kernels</text><text x="69" y="565" class="card-text">Contrasts / permutations</text><rect x="313" y="491" width="235" height="88" rx="12" fill="#fff" stroke="#a9c7d0" stroke-width="1.3"/><text x="327" y="516" class="card-title">λ · continuous</text><text x="327" y="542" class="card-text">fast_lambda kernels</text><text x="327" y="565" class="card-text">Likelihood / optimization</text><rect x="571" y="491" width="235" height="88" rx="12" fill="#fff" stroke="#a9c7d0" stroke-width="1.3"/><text x="585" y="516" class="card-title">D · binary</text><text x="585" y="542" class="card-text">fast_d kernels</text><text x="585" y="565" class="card-text">Contrasts / calibrations</text><rect x="829" y="491" width="235" height="88" rx="12" fill="#fff" stroke="#a9c7d0" stroke-width="1.3"/><text x="843" y="516" class="card-title">Δ · categorical</text><text x="843" y="542" class="card-text">fast_ace → node P</text><text x="843" y="565" class="card-text">fast_delta → MCMC</text><path d="M560 595 V855" class="flow"/><path d="M290 595 V640" class="flow optional"/><path d="M830 595 V640" class="flow optional"/><rect x="40" y="640" width="500" height="160" rx="12" fill="#f8fafc" stroke="#a9c7d0" stroke-width="1.3" stroke-dasharray="7 5"/><text x="65" y="675" class="heading">Optional A · Whole-tree analysis</text><text x="65" y="707" class="body">overall = TRUE: estimate on the full tree.</text><text x="65" y="734" class="body">overall_test = TRUE: add its ordinary signal test.</text><text x="65" y="761" class="body">Reuse the corresponding method kernels.</text><rect x="580" y="640" width="500" height="160" rx="12" fill="#f8fafc" stroke="#a9c7d0" stroke-width="1.3" stroke-dasharray="7 5"/><text x="605" y="675" class="heading">Optional B · Dispersion reference</text><text x="605" y="707" class="body">test = TRUE; use disjoint crowns.</text><text x="605" y="734" class="body">K: BM · λ: approximate common-local-λ.</text><text x="605" y="761" class="body">D: count-conditioned ER (experimental).</text><path d="M290 800 V855" class="flow optional"/><path d="M830 800 V855" class="flow optional"/><rect x="40" y="855" width="1040" height="145" rx="12" fill="#f0f7f9" stroke="#a9c7d0" stroke-width="1.3"/><text x="65" y="890" class="heading">05 · Summarize and plot</text><text x="65" y="922" class="body">clades + heterogeneity + selection; overall when requested.</text><text x="65" y="949" class="body">Local/overall contrasts, state composition, fit diagnostics and failures remain visible.</text><text x="65" y="976" class="body">Native plot(): crown colours, separate test annotations; plotting preserves the RNG state.</text><text x="40" y="1040" class="muted">Recommended Δ workflow: local and whole-tree description, with fit/MCMC diagnostics.</text></svg>
