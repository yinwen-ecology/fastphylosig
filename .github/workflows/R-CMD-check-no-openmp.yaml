name: R-CMD-check (OpenMP disabled)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-no-openmp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-no-openmp:
    name: R-CMD-check without OpenMP flags
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up current R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          needs: check
          extra-packages: any::rcmdcheck
      - name: Disable OpenMP in compilation
        shell: bash
        run: |
          no_openmp_makevars="$RUNNER_TEMP/Makevars.no-openmp"
          cat > "$no_openmp_makevars" <<'EOF'
          SHLIB_OPENMP_CFLAGS =
          SHLIB_OPENMP_CXXFLAGS =
          SHLIB_OPENMP_FFLAGS =
          EOF
          echo "R_MAKEVARS_USER=$no_openmp_makevars" >> "$GITHUB_ENV"
          echo "FASTPHYLOSIG_OPENMP_EXPECTED=disabled" >> "$GITHUB_ENV"
      - name: Run R CMD check without OpenMP
        shell: bash
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/R-CMD-check-no-openmp.log"
          R CMD check --no-manual --no-multiarch . 2>&1 | tee "$log_file"
          if grep -E -- '(^|[[:space:]])(-fopenmp|-qopenmp|-openmp|/openmp)([[:space:]]|$)' "$log_file"; then
            echo "An OpenMP compiler flag was present in the disabled build."
            exit 1
          fi
      - name: Exercise the serial fallback
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fastphylosig-lib"
          R CMD INSTALL . --library="$RUNNER_TEMP/fastphylosig-lib"
          Rscript -e '
            stopifnot(identical(Sys.getenv("FASTPHYLOSIG_OPENMP_EXPECTED"), "disabled"))
            library(fastphylosig, lib.loc = file.path(Sys.getenv("RUNNER_TEMP"), "fastphylosig-lib"))
            set.seed(811)
            tree <- ape::rtree(12)
            x <- stats::setNames(stats::rnorm(12), tree$tip.label)
            permutations <- rbind(seq_len(12), 12:1, c(2:12, 1), c(12, 1:11))
            one <- fast_k(tree, x, test = TRUE, nsim = nrow(permutations),
                          permutations = permutations, ncores = 1,
                          verbose = FALSE, progress = FALSE)
            two <- fast_k(tree, x, test = TRUE, nsim = nrow(permutations),
                          permutations = permutations, ncores = 2,
                          verbose = FALSE, progress = FALSE)
            stopifnot(isTRUE(all.equal(one$K, two$K, tolerance = 1e-12)),
                      identical(one$P, two$P))

            binary <- stats::setNames(rep(0:1, 6), tree$tip.label)
            # Explicit binary fixtures make the D smoke deterministic and
            # exercise the controlled-state path rather than random draws.
            random_states <- matrix(rep(c(0, 1), each = 6),
                                    nrow = 12, ncol = 4)
            brownian_states <- matrix(rep(c(0, 0, 1, 1, 0, 1), 2),
                                      nrow = 12, ncol = 4)
            d1 <- fast_d(tree, binary, test = TRUE, nsim = 4,
                         random_states = random_states,
                         brownian_states = brownian_states, ncores = 1,
                         verbose = FALSE, progress = FALSE)
            d2 <- fast_d(tree, binary, test = TRUE, nsim = 4,
                         random_states = random_states,
                         brownian_states = brownian_states, ncores = 2,
                         verbose = FALSE, progress = FALSE)
            stopifnot(isTRUE(all.equal(d1$DEstimate, d2$DEstimate,
                                      tolerance = 1e-12)),
                      identical(d1$P_random, d2$P_random))

            categorical <- stats::setNames(rep(c("A", "B", "C"), 4),
                                             tree$tip.label)
            delta_permutations <- rbind(c(2:12, 1), c(12, 1:11))
            set.seed(813)
            delta <- suppressWarnings(fast_delta(
              tree, categorical, test = TRUE, nsim = 2, mcmc_sim = 20,
              thin = 5, burn = 5, model = "ER",
              permutations = delta_permutations, ncores = 2,
              verbose = FALSE, progress = FALSE
            ))
            stopifnot(is.finite(delta$delta),
                      delta$successful_simulations == 2)
          '
